version: '3.8'

services:
  # ─── MySQL Database ──────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-edupredict123}
      MYSQL_DATABASE: ${MYSQL_DB:-student_performance}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Flask Backend ───────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-edupredict123}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-student_performance}
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  # ─── React Frontend ─────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
